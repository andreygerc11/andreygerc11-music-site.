<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабінет лікаря | Надія</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #09090b;
            --bg-panel: #141417;
            --bg-card: #1c1c21;
            --bg-input: #000000;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #20c997;
            --text-main: #f0f0f0;
            --text-muted: #888888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif; background-color: var(--bg-base); color: var(--text-main);
            min-height: 100vh; background: radial-gradient(circle at center top, #18181b 0%, #09090b 100%);
        }
        .top-bar {
            min-height: 65px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 15px 30px;
            position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 15px;
        }
        .logo { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; color: #fff; text-decoration: none; letter-spacing: 1px; }
        .logo span { color: var(--accent); }
        .btn-back { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px;}
        .btn-back:hover { color: #fff; }
        .btn-logout-small { background: none; border: 1px solid rgba(255,77,77,0.3); color: #ff4d4d; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
        .btn-logout-small:hover { background: #ff4d4d; color: #fff; }

        .wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        /* ЛОГІН */
        .login-box {
            max-width: 400px; margin: 80px auto; background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .login-box h1 { font-size: 1.3rem; margin-bottom: 25px; text-align: center; }
        .login-box h1 i { color: var(--accent); margin-right: 8px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 700; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 14px; background: var(--bg-input); border: 1px solid var(--border-color);
            color: #fff; border-radius: 10px; font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
        .form-group textarea { resize: vertical; min-height: 90px; }
        .btn-action {
            width: 100%; background: linear-gradient(45deg, var(--accent), #17a67f); color: #04140f; border: none; padding: 15px 30px;
            border-radius: 50px; font-weight: 900; font-size: 0.9rem; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; letter-spacing: 0.5px;
        }
        .btn-action:hover { box-shadow: 0 8px 25px rgba(32, 201, 151, 0.4); }
        .btn-action:disabled { background: #333; color: #777; cursor: not-allowed; }
        .login-error { color: #ff4d4d; font-size: 0.85rem; margin-top: 12px; text-align: center; min-height: 18px; }

        /* СПИСОК ПАЦІЄНТІВ */
        .search-box { margin-bottom: 20px; }
        .patients-table { width: 100%; border-collapse: collapse; background: var(--bg-panel); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); }
        .patients-table th { text-align: left; padding: 14px 18px; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); }
        .patients-table td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); font-size: 0.92rem; }
        .patients-table tr:last-child td { border-bottom: none; }
        .patients-table tr.patient-row { cursor: pointer; transition: 0.2s; }
        .patients-table tr.patient-row:hover { background: rgba(32,201,151,0.06); }
        .badge-count { background: rgba(32,201,151,0.15); color: var(--accent); padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; }
        .empty-state { color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 40px 0; }

        /* КАРТКА ПАЦІЄНТА */
        .patient-detail-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px; }
        .patient-detail-card h2 { font-size: 1.3rem; margin-bottom: 5px; }
        .patient-detail-card .sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
        .field-block { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .field-block:last-child { border-bottom: none; }
        .field-block .field-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 700; }
        .field-block .field-value { color: #eee; white-space: pre-wrap; }

        .consult-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
        .consult-card-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        .consult-status { font-size: 0.72rem; font-weight: 900; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px; }
        .status-pending_payment { background: rgba(255,193,7,0.15); color: #ffc107; }
        .status-paid { background: rgba(32,201,151,0.15); color: var(--accent); }
        .status-completed { background: rgba(76,175,80,0.15); color: #4CAF50; }
        .note-form textarea { margin-bottom: 10px; }
        .note-form .btn-action { width: auto; padding: 10px 24px; font-size: 0.8rem; }
        .btn-print { width: auto; padding: 10px 20px; font-size: 0.78rem; background: transparent; border: 1px solid var(--border-color); color: #fff; border-radius: 50px; cursor: pointer; font-weight: 700; margin-top: 10px; }
        .btn-print:hover { border-color: var(--accent); color: var(--accent); }
        .save-msg { font-size: 0.8rem; margin-top: 8px; font-weight: 700; min-height: 16px; }

        .doc-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
        .doc-item a { color: #fff; text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .doc-item a:hover { color: var(--accent); }
        .doc-item .doc-date { color: var(--text-muted); font-size: 0.75rem; }

        /* ТАБИ */
        .view-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .view-tab { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 22px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        .view-tab.active { background: var(--accent); color: #04140f; border-color: var(--accent); }

        /* ВІДГУКИ */
        .review-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
        .review-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .review-status { font-size: 0.72rem; font-weight: 900; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px; }
        .status-pending { background: rgba(255,193,7,0.15); color: #ffc107; }
        .status-approved { background: rgba(76,175,80,0.15); color: #4CAF50; }
        .status-rejected { background: rgba(255,77,77,0.15); color: #ff4d4d; }
        .review-actions { display: flex; gap: 10px; margin-top: 12px; }
        .btn-approve, .btn-reject { padding: 8px 18px; border-radius: 30px; font-size: 0.78rem; font-weight: 700; cursor: pointer; border: 1px solid; }
        .btn-approve { background: transparent; border-color: #4CAF50; color: #4CAF50; }
        .btn-approve:hover { background: #4CAF50; color: #fff; }
        .btn-reject { background: transparent; border-color: #ff4d4d; color: #ff4d4d; }
        .btn-reject:hover { background: #ff4d4d; color: #fff; }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="medical_hub.html" class="logo">НАДІ<span>Я</span> · ЛІКАР</a>
        <div style="display: flex; gap: 15px; align-items: center;">
            <a href="medical_hub.html" class="btn-back"><i class="fas fa-arrow-left"></i> Медичний хаб</a>
            <button id="logoutBtn" class="btn-logout-small" style="display:none;"><i class="fas fa-sign-out-alt"></i> Вийти</button>
        </div>
    </header>

    <div class="wrap">
        <div id="loginView">
            <div class="login-box">
                <h1><i class="fas fa-user-md"></i>Вхід лікаря</h1>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Логін</label>
                        <input type="text" id="loginInput" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="passwordInput" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-action">Увійти</button>
                    <div class="login-error" id="loginError"></div>
                </form>
            </div>
        </div>

        <div id="listView" style="display:none;">
            <div class="view-tabs">
                <button class="view-tab active" id="tabPatients" onclick="switchTab('patients')">Пацієнти</button>
                <button class="view-tab" id="tabSchedule" onclick="switchTab('schedule')">Розклад</button>
                <button class="view-tab" id="tabReviews" onclick="switchTab('reviews')">Відгуки</button>
                <button class="view-tab" id="tabBlog" onclick="switchTab('blog')">Блог / Поради</button>
            </div>

            <div id="patientsPane">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Пошук за ім'ям, телефоном або email..." style="width:100%; padding: 12px 16px; background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; border-radius: 10px; font-family: inherit; font-size: 0.95rem; outline: none;">
                </div>
                <table class="patients-table" id="patientsTable">
                    <thead>
                        <tr><th>Ім'я</th><th>Телефон</th><th>Email</th><th>Консультації</th></tr>
                    </thead>
                    <tbody id="patientsTableBody"></tbody>
                </table>
            </div>

            <div id="schedulePane" style="display:none;">
                <div id="scheduleList"><div class="empty-state">Завантаження...</div></div>
            </div>

            <div id="reviewsPane" style="display:none;">
                <div id="reviewsList"><div class="empty-state">Завантаження...</div></div>
            </div>

            <div id="blogPane" style="display:none;">
                <div style="background:var(--card-bg,rgba(20,25,23,0.6)); border:1px solid var(--border-color); border-radius:14px; padding:20px; margin-bottom:24px;">
                    <h3 style="margin-bottom:6px;">Нова публікація</h3>
                    <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:16px;">Публікуватиметься під вашим іменем: <b id="blogAuthorName" style="color:var(--accent);"></b></p>
                    <div style="display:flex; flex-direction:column; gap:12px;">
                        <input type="text" id="blogTitle" placeholder="Заголовок" style="width:100%; padding:12px 14px; background:var(--bg-input,#0c1512); border:1px solid var(--border-color); color:#fff; border-radius:10px; font-family:inherit; font-size:0.95rem; outline:none;">
                        <select id="blogCategory" style="width:100%; padding:12px 14px; background:var(--bg-input,#0c1512); border:1px solid var(--border-color); color:#fff; border-radius:10px; font-family:inherit; font-size:0.95rem; outline:none;">
                            <option value="rehab_wife">Порада (Медичний хаб)</option>
                            <option value="rehab">Блог: Реабілітація</option>
                            <option value="psychology">Блог: Психологія</option>
                            <option value="news">Блог: Новини</option>
                        </select>
                        <textarea id="blogContent" placeholder="Текст публікації..." style="width:100%; min-height:160px; padding:12px 14px; background:var(--bg-input,#0c1512); border:1px solid var(--border-color); color:#fff; border-radius:10px; font-family:inherit; font-size:0.95rem; outline:none; resize:vertical;"></textarea>
                        <div style="display:flex; align-items:center; gap:14px;">
                            <button id="blogPublishBtn" class="view-tab active" style="cursor:pointer;" onclick="publishArticle()">Опублікувати</button>
                            <span id="blogStatus" style="font-size:0.85rem; font-weight:700;"></span>
                        </div>
                    </div>
                </div>
                <h3 style="margin-bottom:12px;">Публікації (можна видаляти)</h3>
                <div id="blogList"><div class="empty-state">Завантаження...</div></div>
            </div>
        </div>

        <div id="detailView" style="display:none;">
            <a href="javascript:void(0)" onclick="showListView()" class="btn-back" style="margin-bottom: 20px; display: inline-flex;"><i class="fas fa-arrow-left"></i> До списку пацієнтів</a>
            <div class="patient-detail-card" id="patientDetailContent"></div>
        </div>
    </div>

    <script>
        const API = 'https://andreygerc11-music-site.onrender.com';
        let doctorCreds = null;
        try { doctorCreds = JSON.parse(sessionStorage.getItem('nadiya_doctor_creds')); } catch(e) {}

        const STATUS_LABELS = {
            pending_payment: 'Очікує оплати',
            paid: 'Оплачено, очікує лікаря',
            completed: 'Завершено'
        };

        function formatDate(iso) {
            if (!iso) return '';
            try { return new Date(iso).toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
            catch (e) { return iso; }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str || '';
            return div.innerHTML;
        }

        async function doctorApi(path, extra) {
            const res = await fetch(`${API}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: doctorCreds.login, password: doctorCreds.password, ...extra })
            });
            return res;
        }

        function showLoginView() {
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }

        async function showListView() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-flex';
            await loadPatients();
        }

        function switchTab(tab) {
            document.getElementById('tabPatients').classList.toggle('active', tab === 'patients');
            document.getElementById('tabSchedule').classList.toggle('active', tab === 'schedule');
            document.getElementById('tabReviews').classList.toggle('active', tab === 'reviews');
            document.getElementById('tabBlog').classList.toggle('active', tab === 'blog');
            document.getElementById('patientsPane').style.display = tab === 'patients' ? 'block' : 'none';
            document.getElementById('schedulePane').style.display = tab === 'schedule' ? 'block' : 'none';
            document.getElementById('reviewsPane').style.display = tab === 'reviews' ? 'block' : 'none';
            document.getElementById('blogPane').style.display = tab === 'blog' ? 'block' : 'none';
            if (tab === 'reviews') loadReviews();
            if (tab === 'schedule') loadSchedule();
            if (tab === 'blog') loadBlogEditor();
        }

        const BLOG_CAT_LABELS = { rehab_wife: 'Порада (медхаб)', rehab: 'Реабілітація', psychology: 'Психологія', news: 'Новини' };

        function loadBlogEditor() {
            document.getElementById('blogAuthorName').innerText = (doctorCreds && doctorCreds.doctorName) || 'Лікар';
            loadBlogPosts();
        }

        async function publishArticle() {
            const btn = document.getElementById('blogPublishBtn');
            const st = document.getElementById('blogStatus');
            const title = document.getElementById('blogTitle').value.trim();
            const content = document.getElementById('blogContent').value.trim();
            const category = document.getElementById('blogCategory').value;
            if (!title || !content) { st.style.color = '#ff6b6b'; st.innerText = 'Заповніть заголовок і текст'; return; }
            btn.disabled = true; st.style.color = 'var(--text-muted)'; st.innerText = 'Публікація...';
            try {
                const res = await doctorApi('/api/wife-blog', { title, content, category });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success) {
                    document.getElementById('blogTitle').value = '';
                    document.getElementById('blogContent').value = '';
                    st.style.color = 'var(--accent)'; st.innerText = '✅ Опубліковано під вашим іменем!';
                    loadBlogPosts();
                } else if (res.status === 403) {
                    st.style.color = '#ff6b6b'; st.innerText = 'Сесія недійсна — увійдіть знову.';
                } else {
                    st.style.color = '#ff6b6b'; st.innerText = data.error || 'Не вдалося опублікувати';
                }
            } catch (e) { st.style.color = '#ff6b6b'; st.innerText = 'Помилка з\'єднання'; }
            finally { btn.disabled = false; }
        }

        async function loadBlogPosts() {
            const list = document.getElementById('blogList');
            list.innerHTML = '<div class="empty-state">Завантаження...</div>';
            try {
                const res = await fetch(`${API}/api/blog?t=` + Date.now());
                const posts = await res.json();
                // Показуємо все, що редаговане лікарями (мають автора або це поради медхабу), найновіші зверху
                const editable = (posts || []).filter(p => p.author || p.isWifeTip).sort((a, b) => (b.id || 0) - (a.id || 0));
                if (editable.length === 0) { list.innerHTML = '<div class="empty-state">Публікацій лікарів ще немає. Створіть першу вище.</div>'; return; }
                list.innerHTML = editable.map(p => `
                    <div style="background:var(--bg-input,#0c1512); border:1px solid var(--border-color); border-radius:12px; padding:14px 16px; margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start;">
                            <div style="flex:1;">
                                <span style="font-size:0.72rem; font-weight:800; color:var(--accent); text-transform:uppercase;">${escapeHtml(BLOG_CAT_LABELS[p.category] || p.category || '')}</span>
                                <div style="font-weight:700; margin:4px 0;">${escapeHtml((p.title || '').replace(/<[^>]*>/g, ' '))}</div>
                                <div style="color:var(--text-muted); font-size:0.78rem;">${p.author ? '✍️ ' + escapeHtml(p.author) + ' · ' : ''}${escapeHtml(p.date || '')}</div>
                            </div>
                            <button onclick="deleteBlogPost(${p.id})" style="background:transparent; border:1px solid #ff6b6b55; color:#ff6b6b; border-radius:8px; padding:6px 10px; font-size:0.78rem; font-weight:700; cursor:pointer; white-space:nowrap;">Видалити</button>
                        </div>
                    </div>`).join('');
            } catch (e) { list.innerHTML = '<div class="empty-state">Помилка завантаження.</div>'; }
        }

        async function deleteBlogPost(id) {
            if (!confirm('Видалити цю публікацію назавжди?')) return;
            try {
                const res = await doctorApi('/api/wife-blog/delete', { id });
                if (res.ok) loadBlogPosts();
                else alert('Не вдалося видалити (перевірте вхід).');
            } catch (e) { alert('Помилка сервера.'); }
        }

        const APPT_SLOTS = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];

        async function loadSchedule() {
            const list = document.getElementById('scheduleList');
            list.innerHTML = '<div class="empty-state">Завантаження...</div>';
            try {
                const res = await doctorApi('/api/doctor/appointments');
                if (!res.ok) throw new Error();
                const items = await res.json();
                if (!items || items.length === 0) { list.innerHTML = '<div class="empty-state">Записів на прийом ще немає.</div>'; return; }
                const today = new Date().toISOString().slice(0,10);
                const byDate = {};
                items.forEach(a => { (byDate[a.date] = byDate[a.date] || []).push(a); });
                list.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:14px;">Можете перенести час/дату або скасувати запис — пацієнту автоматично прийде повідомлення в Telegram (якщо він писав боту).</p>' +
                    Object.keys(byDate).sort().map(date => `
                    <div style="margin-bottom:18px;">
                        <div style="font-weight:800;color:var(--accent);margin-bottom:8px;"><i class="fas fa-calendar-day"></i> ${escapeHtml(date)}</div>
                        ${byDate[date].sort((x,y)=>x.time.localeCompare(y.time)).map(a => `
                            <div style="padding:12px 14px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:10px;margin-bottom:10px;">
                                <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
                                    <span style="font-weight:800;min-width:52px;">${escapeHtml(a.time)}</span>
                                    <span style="flex:1;min-width:160px;">${escapeHtml(a.patientName || a.patientEmail)}<br><span style="color:var(--text-muted);font-size:0.82rem;">${escapeHtml(a.patientEmail)}</span></span>
                                    <span style="color:var(--text-muted);font-size:0.82rem;">${escapeHtml(a.doctorName)}</span>
                                </div>
                                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;">
                                    <input type="date" id="apd_${a.id}" value="${escapeHtml(a.date)}" min="${today}" style="padding:8px 10px;background:var(--bg-panel,#141417);border:1px solid var(--border-color);color:#fff;border-radius:8px;font-family:inherit;font-size:0.85rem;">
                                    <select id="apt_${a.id}" style="padding:8px 10px;background:var(--bg-panel,#141417);border:1px solid var(--border-color);color:#fff;border-radius:8px;font-family:inherit;font-size:0.85rem;">
                                        ${APPT_SLOTS.map(t => `<option value="${t}" ${t===a.time?'selected':''}>${t}</option>`).join('')}
                                    </select>
                                    <button onclick="rescheduleAppt(${a.id})" style="background:var(--accent);color:#04140f;border:none;border-radius:8px;padding:8px 14px;font-weight:800;font-size:0.82rem;cursor:pointer;">Перенести</button>
                                    <button onclick="cancelApptDoctor(${a.id})" style="background:transparent;color:#ff6b6b;border:1px solid #ff6b6b55;border-radius:8px;padding:8px 12px;font-weight:700;font-size:0.82rem;cursor:pointer;">Скасувати</button>
                                    <span id="aps_${a.id}" style="font-size:0.8rem;font-weight:700;"></span>
                                </div>
                            </div>`).join('')}
                    </div>`).join('');
            } catch (e) {
                list.innerHTML = '<div class="empty-state">Помилка завантаження розкладу.</div>';
            }
        }

        async function rescheduleAppt(id) {
            const date = document.getElementById('apd_' + id).value;
            const time = document.getElementById('apt_' + id).value;
            const st = document.getElementById('aps_' + id);
            st.style.color = 'var(--text-muted)'; st.innerText = 'Збереження...';
            try {
                const res = await doctorApi('/api/doctor/appointment/update', { id, date, time });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success) {
                    st.style.color = 'var(--accent)';
                    st.innerText = data.notified ? '✅ Перенесено, пацієнта сповіщено' : '✅ Перенесено (Telegram пацієнта невідомий)';
                    loadSchedule();
                } else { st.style.color = '#ff6b6b'; st.innerText = data.error || 'Помилка'; }
            } catch (e) { st.style.color = '#ff6b6b'; st.innerText = 'Помилка з\'єднання'; }
        }

        async function cancelApptDoctor(id) {
            if (!confirm('Скасувати цей запис? Пацієнту прийде повідомлення.')) return;
            const st = document.getElementById('aps_' + id);
            st.style.color = 'var(--text-muted)'; st.innerText = 'Скасування...';
            try {
                const res = await doctorApi('/api/doctor/appointment/cancel', { id });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success) { loadSchedule(); }
                else { st.style.color = '#ff6b6b'; st.innerText = data.error || 'Помилка'; }
            } catch (e) { st.style.color = '#ff6b6b'; st.innerText = 'Помилка з\'єднання'; }
        }

        const REVIEW_STATUS_LABELS = { pending: 'На перевірці', approved: 'Опубліковано', rejected: 'Відхилено' };

        async function loadReviews() {
            const list = document.getElementById('reviewsList');
            list.innerHTML = '<div class="empty-state">Завантаження...</div>';
            try {
                const res = await doctorApi('/api/doctor/reviews');
                if (!res.ok) throw new Error();
                const reviews = await res.json();
                renderReviews(reviews);
            } catch (e) {
                list.innerHTML = '<div class="empty-state">Помилка завантаження відгуків.</div>';
            }
        }

        function renderReviews(reviews) {
            const list = document.getElementById('reviewsList');
            if (!reviews || reviews.length === 0) {
                list.innerHTML = '<div class="empty-state">Відгуків ще немає.</div>';
                return;
            }
            list.innerHTML = reviews.slice().reverse().map(r => `
                <div class="review-card">
                    <div class="review-card-head">
                        <strong>${escapeHtml(r.name)}</strong>
                        <span class="review-status status-${r.status}">${REVIEW_STATUS_LABELS[r.status] || r.status}</span>
                    </div>
                    <p style="color:#ccc; font-size:0.9rem;">${escapeHtml(r.text)}</p>
                    <div style="color:var(--text-muted); font-size:0.75rem; margin-top:8px;">${escapeHtml(r.email)} · ${formatDate(r.createdAt)}</div>
                    ${r.status === 'pending' ? `
                        <div class="review-actions">
                            <button class="btn-approve" onclick="moderateReview(${r.id}, 'approve')">Опублікувати</button>
                            <button class="btn-reject" onclick="moderateReview(${r.id}, 'reject')">Відхилити</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function moderateReview(id, action) {
            try {
                const res = await doctorApi('/api/doctor/reviews/moderate', { id, action });
                if (!res.ok) throw new Error();
                loadReviews();
            } catch (e) {
                alert('Не вдалося оновити відгук.');
            }
        }

        let allPatients = [];

        async function loadPatients() {
            const tbody = document.getElementById('patientsTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Завантаження...</td></tr>';
            try {
                const res = await doctorApi('/api/doctor/patients');
                if (res.status === 403) { sessionStorage.removeItem('nadiya_doctor_creds'); showLoginView(); return; }
                allPatients = await res.json();
                renderPatientsTable(allPatients);
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Помилка завантаження списку.</td></tr>';
            }
        }

        function renderPatientsTable(patients) {
            const tbody = document.getElementById('patientsTableBody');
            if (!patients || patients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Пацієнтів ще немає.</td></tr>';
                return;
            }
            tbody.innerHTML = patients.map(p => `
                <tr class="patient-row" onclick="openPatient('${escapeHtml(p.email)}')">
                    <td>${escapeHtml(p.fullName) || '<span style="color:var(--text-muted);">Без імені</span>'}</td>
                    <td>${escapeHtml(p.phone) || '—'}</td>
                    <td>${escapeHtml(p.email)}</td>
                    <td><span class="badge-count">${p.consultationsCount}</span></td>
                </tr>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.trim().toLowerCase();
            if (!q) return renderPatientsTable(allPatients);
            renderPatientsTable(allPatients.filter(p =>
                (p.fullName || '').toLowerCase().includes(q) ||
                (p.phone || '').toLowerCase().includes(q) ||
                (p.email || '').toLowerCase().includes(q)
            ));
        });

        async function openPatient(email) {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
            const content = document.getElementById('patientDetailContent');
            content.innerHTML = '<div class="empty-state">Завантаження...</div>';
            try {
                const res = await doctorApi('/api/doctor/patient', { email });
                if (!res.ok) throw new Error();
                const patient = await res.json();
                renderPatientDetail(patient);
            } catch (e) {
                content.innerHTML = '<div class="empty-state">Не вдалося завантажити картку пацієнта.</div>';
            }
        }

        let currentPatient = null;

        function renderPatientDetail(patient) {
            currentPatient = patient;
            const content = document.getElementById('patientDetailContent');
            const consultations = (patient.consultations || []).slice().reverse();
            const documents = patient.documents || [];

            content.innerHTML = `
                <h2>${escapeHtml(patient.fullName) || 'Без імені'}</h2>
                <div class="sub">${escapeHtml(patient.email)} ${patient.phone ? '· ' + escapeHtml(patient.phone) : ''} ${patient.birthDate ? '· ' + escapeHtml(patient.birthDate) : ''}</div>

                <div class="field-block">
                    <div class="field-label">Історія хвороби / скарги</div>
                    <div class="field-value">${escapeHtml(patient.medicalHistory) || '<span style="color:var(--text-muted);">Пацієнт ще не заповнив</span>'}</div>
                </div>

                <div class="field-block">
                    <div class="field-label">Медичні документи пацієнта (${documents.length})</div>
                    ${documents.length === 0 ? '<div style="color:var(--text-muted);">Пацієнт ще не завантажив документи.</div>' : documents.slice().reverse().map(d => `
                        <div class="doc-item">
                            <a href="${d.webViewLink || '#'}" target="_blank"><i class="fas fa-file-alt" style="color: var(--accent);"></i> ${escapeHtml(d.name)}</a>
                            <span class="doc-date">${formatDate(d.uploadedAt)}</span>
                        </div>
                    `).join('')}
                    <p style="color:var(--text-muted); font-size:0.78rem; margin-top:8px;">Документи зберігаються на Google Диску пацієнта — посилання відкриється лише якщо доступ уже надано.</p>
                </div>

                <div class="field-block">
                    <div class="field-label">Консультації (${consultations.length})</div>
                    ${consultations.length === 0 ? '<div style="color:var(--text-muted);">Ще немає жодної консультації.</div>' : consultations.map(c => `
                        <div class="consult-card" id="consult-${c.id}">
                            <div class="consult-card-head">
                                <span>${formatDate(c.createdAt)}</span>
                                <span class="consult-status status-${c.status}">${STATUS_LABELS[c.status] || c.status}</span>
                            </div>
                            <div class="note-form">
                                <div class="form-group">
                                    <label>Лікар</label>
                                    <input type="text" id="doctorName-${c.id}" value="${escapeHtml(c.doctorName || (doctorCreds && doctorCreds.doctorName) || '')}" placeholder="Ім'я лікаря">
                                </div>
                                <div class="form-group">
                                    <label>Нотатки консультації</label>
                                    <textarea id="notes-${c.id}" placeholder="Опис прийому, стан пацієнта...">${escapeHtml(c.notes) || ''}</textarea>
                                </div>
                                <div class="form-group">
                                    <label>Призначення / приписи</label>
                                    <textarea id="prescription-${c.id}" placeholder="Рекомендації, вправи, препарати...">${escapeHtml(c.prescription) || ''}</textarea>
                                </div>
                                <button class="btn-action" onclick="saveNote(${c.id}, '${escapeHtml(patient.email)}')">Зберегти</button>
                                <button class="btn-print" onclick="printConsultationCard(${c.id})"><i class="fas fa-print"></i> Друкувати картку</button>
                                <div class="save-msg" id="saveMsg-${c.id}"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function printConsultationCard(consultationId) {
            if (!currentPatient) return;
            const c = (currentPatient.consultations || []).find(x => x.id === consultationId);
            if (!c) return;

            // Беремо актуальні значення прямо з полів форми (лікар міг щойно ввести,
            // ще не натиснувши "Зберегти").
            const doctorName = document.getElementById(`doctorName-${consultationId}`)?.value || c.doctorName || '';
            const notes = document.getElementById(`notes-${consultationId}`)?.value || c.notes || '';
            const prescription = document.getElementById(`prescription-${consultationId}`)?.value || c.prescription || '';

            const win = window.open('', '_blank');
            win.document.write(`
                <!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><title>Консультативний висновок</title>
                <style>
                    body { font-family: 'Times New Roman', serif; padding: 30px; color: #000; }
                    .header { display: flex; justify-content: space-between; border: 1px solid #000; padding: 12px; margin-bottom: 0; }
                    .header h1 { font-size: 1.1rem; margin: 0 0 6px; }
                    .header .right { text-align: right; font-size: 0.85rem; }
                    h2.title { text-align: center; border: 1px solid #000; border-top: none; padding: 14px; margin: 0 0 20px; font-size: 1.2rem; }
                    .row { display: flex; border-bottom: 1px solid #000; padding: 8px 4px; }
                    .row .label { width: 260px; font-size: 0.85rem; }
                    .row .value { flex: 1; border-bottom: 1px dotted #000; min-height: 20px; }
                    .block { margin-top: 20px; }
                    .block .label { font-weight: bold; font-size: 0.9rem; margin-bottom: 6px; }
                    .block .value { border: 1px solid #000; min-height: 60px; padding: 10px; white-space: pre-wrap; font-size: 0.9rem; }
                    .sign-row { display: flex; justify-content: flex-end; margin-top: 50px; font-size: 0.85rem; }
                    .sign-row div { border-top: 1px solid #000; padding-top: 5px; width: 220px; text-align: center; }
                    @media print { body { padding: 10px; } }
                </style></head><body>
                    <div class="header">
                        <div style="display:flex; align-items:center; gap:14px;">
                            <img src="${location.origin}/logo.png" alt="Надія" style="height:58px; width:auto;">
                            <div><h1>Реабілітаційний центр «Надія»</h1><div style="font-size:0.8rem;">ФОП Герц Андрій Костянтинович</div></div>
                        </div>
                        <div class="right">КОНСУЛЬТАТИВНИЙ ВИСНОВОК<br>Дата: ${formatDate(c.createdAt)}</div>
                    </div>
                    <h2 class="title">Консультативний висновок</h2>

                    <div class="row"><div class="label">Прізвище, ім'я, по батькові:</div><div class="value">${escapeHtml(currentPatient.fullName) || ''}</div></div>
                    <div class="row"><div class="label">Дата народження:</div><div class="value">${escapeHtml(currentPatient.birthDate) || ''}</div></div>
                    <div class="row"><div class="label">Телефон:</div><div class="value">${escapeHtml(currentPatient.phone) || ''}</div></div>
                    <div class="row"><div class="label">Лікар:</div><div class="value">${escapeHtml(doctorName)}</div></div>

                    <div class="block"><div class="label">Історія хвороби / скарги:</div><div class="value">${escapeHtml(currentPatient.medicalHistory) || ''}</div></div>
                    <div class="block"><div class="label">Нотатки консультації:</div><div class="value">${escapeHtml(notes)}</div></div>
                    <div class="block"><div class="label">Призначення / рекомендації:</div><div class="value">${escapeHtml(prescription)}</div></div>

                    <div class="sign-row">
                        <div>Підпис лікаря</div>
                    </div>
                </body></html>
            `);
            win.document.close();
            win.focus();
            setTimeout(() => win.print(), 300);
        }

        async function saveNote(consultationId, email) {
            const msgEl = document.getElementById(`saveMsg-${consultationId}`);
            msgEl.innerText = 'Збереження...';
            msgEl.style.color = 'var(--text-muted)';
            try {
                const res = await doctorApi('/api/doctor/patient/note', {
                    email,
                    consultationId,
                    doctorName: document.getElementById(`doctorName-${consultationId}`).value,
                    notes: document.getElementById(`notes-${consultationId}`).value,
                    prescription: document.getElementById(`prescription-${consultationId}`).value
                });
                if (!res.ok) throw new Error();
                msgEl.innerText = '✅ Збережено';
                msgEl.style.color = '#4CAF50';
            } catch (e) {
                msgEl.innerText = '❌ Помилка збереження';
                msgEl.style.color = '#ff4d4d';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('loginError');
            const btn = e.target.querySelector('button');
            btn.disabled = true; btn.innerText = 'Перевірка...'; errorEl.innerText = '';

            const login = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            try {
                const res = await fetch(`${API}/api/doctor/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    doctorCreds = { login, password, doctorName: data.doctorName || '' };
                    sessionStorage.setItem('nadiya_doctor_creds', JSON.stringify(doctorCreds));
                    showListView();
                } else {
                    errorEl.innerText = 'Невірний логін або пароль';
                }
            } catch (e) {
                errorEl.innerText = 'Помилка з\'єднання з сервером';
            } finally {
                btn.disabled = false; btn.innerText = 'Увійти';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('nadiya_doctor_creds');
            doctorCreds = null;
            showLoginView();
        });

        if (doctorCreds) showListView(); else showLoginView();
    </script>
<script src="bg.js"></script>
</body>
</html>
