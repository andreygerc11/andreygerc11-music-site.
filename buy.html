<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оплата застосунків — Hertz Electronics</title>
<meta name="description" content="Оплата підписки на застосунки Hertz Electronics карткою будь-якого банку, Apple Pay чи Google Pay. Ключ одразу після оплати.">
<link rel="icon" href="icons/hertz-mark.png">
<style>
*{box-sizing:border-box}
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#e9ecf2;--muted:#9aa3b2;--acc:#2f81f7;--ok:#2fbf71;--bad:#e5484d}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:#6aa8ff}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header{background:linear-gradient(135deg,#1b2a4a,#132036 60%,#0f1115);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:16px 0}
.top img{width:40px;height:40px;border-radius:10px}
.brand{font-weight:700;font-size:18px;flex:1}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.lang{display:flex;gap:6px}
.lang button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
.lang button.on{color:#fff;border-color:var(--acc);background:#1e3a66}
.hero{padding:18px 0 26px}
.hero h1{margin:0 0 8px;font-size:28px;line-height:1.25}
.hero p{margin:0;color:#c7cfdc;max-width:760px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{background:#1d2433;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:#c7cfdc}
main{padding:24px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
h2{margin:0 0 14px;font-size:20px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.app{display:flex;gap:10px;align-items:center;background:#11141b;border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.app img{width:38px;height:38px;border-radius:9px}
.app b{display:block;font-size:15px}
.app small{color:var(--muted)}
.app.on{border-color:var(--acc);background:#13213a}
.sel{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;margin-top:16px}
.sel img{width:72px;height:72px;border-radius:16px}
.sel h3{margin:0;font-size:22px}
.os{color:var(--muted);font-size:14px}
.price{font-size:30px;font-weight:800;margin:6px 0 2px}
.price small{font-size:15px;font-weight:400;color:var(--muted)}
ul.get{margin:10px 0 0;padding:0;list-style:none}
ul.get li{padding:3px 0 3px 26px;position:relative}
ul.get li:before{content:"✓";position:absolute;left:4px;color:var(--ok);font-weight:700}
.form{display:grid;gap:12px;margin-top:18px}
label.t{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=email]{width:100%;background:#0d1016;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font:inherit}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#c7cfdc}
.check input{margin-top:4px;width:18px;height:18px}
.pay{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;width:100%}
.pay[disabled]{opacity:.6;cursor:default}
.methods{color:var(--muted);font-size:13px;text-align:center}
.note{background:#12233c;border:1px solid #23406b;border-radius:10px;padding:10px 12px;font-size:14px;color:#cfe0ff}
.err{color:var(--bad);font-size:14px;min-height:1em}
.status{text-align:center;padding:10px 0}
.spin{width:38px;height:38px;border:4px solid #2a3140;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;margin:10px auto}
@keyframes s{to{transform:rotate(360deg)}}
.key{font:700 24px/1.3 Consolas,monospace;letter-spacing:1px;background:#0d1016;border:1px dashed #3a4558;border-radius:12px;padding:14px;margin:12px 0;word-break:break-all;user-select:all}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{display:inline-block;background:#222a38;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer;font:inherit}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.ok{color:var(--ok)}.bad{color:var(--bad)}
ol.steps{text-align:left;max-width:560px;margin:14px auto 0;color:#c7cfdc}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:18px 0 30px}
footer a{color:var(--muted)}
.hide{display:none!important}
@media(max-width:560px){.hero h1{font-size:23px}.sel{grid-template-columns:56px 1fr}.sel img{width:56px;height:56px}}
</style>
</head>

    <div class="sel" id="sel"></div>
    <div class="form">
      <div class="note hide" id="tgnote" data-t="tgnote"></div>

      <label class="check"><input type="checkbox" id="agree"><span data-t="agree"></span></label>
      <div class="err" id="err"></div>
      <button class="pay" id="pay" type="button"></button>
      <div class="methods" data-t="methods"></div>
    </div>
  </section>
  <section class="card hide" id="order">
    <div class="status" id="ost"></div>
  </section>
  <section class="card">
    <h2 data-t="faqh"></h2>
    <p data-t="faq1"></p>
    <p data-t="faq2"></p>
    <p data-t="faq3" style="margin-bottom:0"></p>
  </section>
</main>
<footer>
  <div class="wrap">
    <span data-t="seller"></span> · <a href="public_offer.html" data-t="offer"></a> · <a href="apps.html" data-t="all"></a> · <a href="contacts.html" data-t="contacts"></a>
  </div>
</footer>

 }
 if(['failure','expired','reversed'].indexOf(o.status)>=0){
  box.innerHTML='<p class="bad" style="font-size:20px"><b>'+t('fail')+'</b></p><p>'+t('fail2')+'</p><p><a class="btn acc" href="buy.html?p='+encodeURIComponent(o.product)+(lang==='en'?'&lang=en':'')+'">'+t('retry')+'</a></p>';
  return;
 }
 box.innerHTML='<div class="spin"></div><p><b>'+t('wait')+'</b></p><p class="os">'+(tries>40?t('slow'):t('wait2'))+'</p>';
}
function poll(){
 fetch(API+'/api/v1/order?o='+orderId).then(function(r){return r.json()}).then(function(o){
  last=o;tries++;drawOrder(o);
  if(!(o.error||o.status==='success'&&o.key||['failure','expired','reversed'].indexOf(o.status)>=0)&&tries<200)setTimeout(poll,tries<20?2500:6000);
 }).catch(function(){tries++;if(tries<200)setTimeout(poll,5000)});
}
if(orderId){$('shop').classList.add('hide');$('order').classList.remove('hide');drawOrder(null);poll()}
render();
})();
</script>
</body>
</html>
