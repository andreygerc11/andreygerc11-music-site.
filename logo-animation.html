<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анімація логотипа | Надія</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root { --teal: #0f7d7d; --glow: rgba(24,170,155,0.55); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Montserrat', sans-serif;
        background: radial-gradient(circle at 50% 44%, #0e211e 0%, #08090b 72%);
        color: #eaf2ef;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; gap: 22px; overflow: hidden;
    }
    .stage { position: relative; width: 360px; height: 360px; }
    .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

    /* Мʼяке сяйво під час перетворення */
    .flash {
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, var(--glow) 0%, transparent 62%);
        opacity: 0; transform: scale(.6); pointer-events: none;
        animation: flash 1.1s 2.5s ease-out forwards;
    }

    /* Дерево життя: «виростає» знизу вгору, тоді розчиняється */
    .tree {
        clip-path: inset(100% 0 0 0);
        transform: scale(.82); transform-origin: 50% 100%; opacity: 0;
        filter: drop-shadow(0 4px 16px rgba(0,0,0,.45));
        animation: grow 1.7s .25s cubic-bezier(.2,.75,.25,1) forwards,
                   dissolve 1.0s 2.6s ease forwards;
    }

    /* Логотип: збирається на місці дерева */
    .logo {
        opacity: 0; transform: scale(.86) rotate(-5deg); transform-origin: 50% 50%;
        filter: drop-shadow(0 6px 26px rgba(0,0,0,.5));
        animation: logoIn 1.2s 2.7s cubic-bezier(.22,.9,.3,1) forwards,
                   settle 1.6s 3.9s ease-in-out forwards;
    }

    .wordmark { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 2.6rem;
        letter-spacing: 2px; opacity: 0; transform: translateY(14px); animation: wordIn .8s 3.8s ease forwards; }
    .wordmark span { color: var(--teal); }
    .tagline { font-size: .72rem; letter-spacing: 4px; text-transform: uppercase; color: #6fb9b0;
        opacity: 0; animation: wordIn .8s 4.2s ease forwards; }
    .replay { margin-top: 4px; background: transparent; border: 1px solid var(--teal);
        color: #9fe4dc; font-family: inherit; font-weight: 700; font-size: .8rem;
        padding: 10px 22px; border-radius: 30px; cursor: pointer; transition: .25s;
        opacity: 0; animation: wordIn .6s 4.6s ease forwards; }
    .replay:hover { background: var(--teal); color: #04140f; }

    @keyframes grow {
        0%   { clip-path: inset(100% 0 0 0); opacity: 0; transform: scale(.82); }
        20%  { opacity: 1; }
        100% { clip-path: inset(0 0 0 0); opacity: 1; transform: scale(1); }
    }
    @keyframes dissolve { to { opacity: 0; transform: scale(1.12); filter: blur(4px) drop-shadow(0 4px 16px rgba(0,0,0,.45)); } }
    @keyframes logoIn { 0% { opacity: 0; transform: scale(.86) rotate(-5deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes settle { 0%,100% { transform: scale(1); } 45% { transform: scale(1.045); } }
    @keyframes flash { 0% { opacity: 0; transform: scale(.6); } 35% { opacity: .9; } 100% { opacity: 0; transform: scale(1.25); } }
    @keyframes wordIn { to { opacity: 1; transform: translateY(0); } }

    body:not(.run) .stage *, body:not(.run) .wordmark, body:not(.run) .tagline, body:not(.run) .replay { animation: none; }
</style>
</head>
<body class="run">

    <div class="stage">
        <div class="flash"></div>
        <img class="tree" src="derevo.png" alt="Дерево життя">
        <img class="logo" src="logo.png" alt="Логотип Надія">
    </div>

    <div class="wordmark">Наді<span>я</span></div>
    <div class="tagline">Реабілітаційний центр</div>
    <button class="replay" onclick="restart()">↻ Відтворити знову</button>

<script>
    function restart() {
        const b = document.body;
        b.classList.remove('run');
        void b.offsetWidth;   // форсуємо перезапуск анімацій
        b.classList.add('run');
    }
</script>
</body>
</html>
