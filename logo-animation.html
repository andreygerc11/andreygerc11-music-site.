<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анімація логотипа | Надія</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --teal: #0f7d7d;          /* колір логотипа */
        --bark: #14615f;          /* стовбур */
        --leaf-a: #12867f;        /* листя (задній план) */
        --leaf-b: #1cae9f;        /* листя (передній план) */
        --glow: rgba(24,170,155,0.5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Montserrat', sans-serif;
        background: radial-gradient(circle at 50% 42%, #0e211e 0%, #08090b 72%);
        color: #eaf2ef;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; gap: 24px; overflow: hidden;
    }

    .stage { position: relative; width: 340px; height: 340px; }
    .stage svg, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* ── Ґрунт ── */
    .ground line { stroke: var(--teal); stroke-width: 3; stroke-linecap: round; opacity: 0;
        animation: groundIn .5s ease forwards; }

    /* ── Стовбур і гілки: ростуть угору (scaleY від низу) + промальовуються ── */
    .tree { }
    .wood path {
        fill: none; stroke: var(--bark); stroke-linecap: round; stroke-linejoin: round;
        filter: drop-shadow(0 0 4px var(--glow));
    }
    .wood { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0);
        animation: grow 1.25s .35s cubic-bezier(.18,.7,.2,1) forwards; }
    .trunk  { stroke-width: 11; stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1.2s .4s ease forwards; }
    .b1 { stroke-width: 7;  stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .7s 1.0s ease forwards; }
    .b2 { stroke-width: 7;  stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .7s 1.1s ease forwards; }
    .b3 { stroke-width: 5;  stroke-dasharray: 90;  stroke-dashoffset: 90;  animation: draw .6s 1.35s ease forwards; }
    .b4 { stroke-width: 5;  stroke-dasharray: 90;  stroke-dashoffset: 90;  animation: draw .6s 1.45s ease forwards; }
    .b5 { stroke-width: 5;  stroke-dasharray: 90;  stroke-dashoffset: 90;  animation: draw .6s 1.55s ease forwards; }

    /* ── Крона: багато листків, що розпускаються по черзі ── */
    .leaf { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0);
        filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
    .leaf.run-pop { animation: pop .5s cubic-bezier(.2,1.5,.4,1) forwards; }

    /* ── Дерево зникає, коли проявляється логотип ── */
    .tree, .foliage, .ground { animation-fill-mode: forwards; }
    .fadeout { animation: fadeOut .8s 3.0s ease forwards; }

    /* ── Справжній логотип: проявляється знизу вгору ── */
    .logo {
        clip-path: inset(100% 0 0 0);
        transform: scale(.92); transform-origin: 50% 100%; opacity: 0;
        animation: reveal 1.25s 2.9s cubic-bezier(.22,.9,.3,1) forwards,
                   settle 1.6s 4.15s ease-in-out forwards;
        filter: drop-shadow(0 6px 26px rgba(0,0,0,.5));
    }

    .wordmark { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 2.6rem;
        letter-spacing: 2px; opacity: 0; transform: translateY(14px);
        animation: wordIn .8s 4.1s ease forwards; }
    .wordmark span { color: var(--teal); }
    .tagline { font-size: .72rem; letter-spacing: 4px; text-transform: uppercase; color: #6fb9b0;
        opacity: 0; animation: wordIn .8s 4.5s ease forwards; }

    .replay { margin-top: 4px; background: transparent; border: 1px solid var(--teal);
        color: #9fe4dc; font-family: inherit; font-weight: 700; font-size: .8rem;
        padding: 10px 22px; border-radius: 30px; cursor: pointer; transition: .25s;
        opacity: 0; animation: wordIn .6s 4.9s ease forwards; }
    .replay:hover { background: var(--teal); color: #04140f; }

    @keyframes groundIn { to { opacity: .5; } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop  { to { transform: scale(1); } }
    @keyframes fadeOut { to { opacity: 0; } }
    @keyframes reveal { 0% { clip-path: inset(100% 0 0 0); opacity: 0; transform: scale(.92); }
                        15% { opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 1; transform: scale(1); } }
    @keyframes settle { 0%,100% { transform: scale(1); } 40% { transform: scale(1.04); } }
    @keyframes wordIn { to { opacity: 1; transform: translateY(0); } }

    /* Вимикаємо всі анімації, поки немає класу .run (для перезапуску) */
    body:not(.run) .stage *, body:not(.run) .wordmark, body:not(.run) .tagline, body:not(.run) .replay { animation: none; }
</style>
</head>
<body class="run">

    <div class="stage">
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
            <g class="ground fadeout"><line x1="66" y1="286" x2="234" y2="286"/></g>

            <!-- Стовбур і гілки -->
            <g class="tree fadeout">
                <g class="wood">
                    <path class="trunk" d="M150,286 C149,250 147,220 150,168"/>
                    <path class="b1" d="M150,196 C132,182 116,172 100,150"/>
                    <path class="b2" d="M150,182 C168,170 184,162 200,142"/>
                    <path class="b3" d="M112,164 C104,156 98,150 92,136"/>
                    <path class="b4" d="M186,152 C194,144 200,138 206,124"/>
                    <path class="b5" d="M150,168 C151,152 150,138 150,120"/>
                </g>

                <!-- Крона: листки двома відтінками, розпускаються по черзі -->
                <g class="foliage">
                    <g transform="translate(92,138)  rotate(-55)"><path class="leaf" style="animation-delay:1.15s" fill="var(--leaf-a)" d="M0,-15 Q11,-3 0,15 Q-11,-3 0,-15 Z"/></g>
                    <g transform="translate(104,150) rotate(-35)"><path class="leaf" style="animation-delay:1.22s" fill="var(--leaf-b)" d="M0,-14 Q10,-3 0,14 Q-10,-3 0,-14 Z"/></g>
                    <g transform="translate(118,132) rotate(-30)"><path class="leaf" style="animation-delay:1.30s" fill="var(--leaf-a)" d="M0,-16 Q11,-3 0,16 Q-11,-3 0,-16 Z"/></g>
                    <g transform="translate(132,146) rotate(-18)"><path class="leaf" style="animation-delay:1.38s" fill="var(--leaf-b)" d="M0,-13 Q9,-2 0,13 Q-9,-2 0,-13 Z"/></g>
                    <g transform="translate(150,120) rotate(0)"><path class="leaf" style="animation-delay:1.46s" fill="var(--leaf-b)" d="M0,-17 Q12,-3 0,17 Q-12,-3 0,-17 Z"/></g>
                    <g transform="translate(150,138) rotate(8)"><path class="leaf" style="animation-delay:1.30s" fill="var(--leaf-a)" d="M0,-14 Q10,-3 0,14 Q-10,-3 0,-14 Z"/></g>
                    <g transform="translate(168,132) rotate(22)"><path class="leaf" style="animation-delay:1.54s" fill="var(--leaf-b)" d="M0,-15 Q11,-3 0,15 Q-11,-3 0,-15 Z"/></g>
                    <g transform="translate(184,146) rotate(30)"><path class="leaf" style="animation-delay:1.62s" fill="var(--leaf-a)" d="M0,-14 Q10,-3 0,14 Q-10,-3 0,-14 Z"/></g>
                    <g transform="translate(198,134) rotate(48)"><path class="leaf" style="animation-delay:1.70s" fill="var(--leaf-b)" d="M0,-15 Q11,-3 0,15 Q-11,-3 0,-15 Z"/></g>
                    <g transform="translate(206,120) rotate(55)"><path class="leaf" style="animation-delay:1.78s" fill="var(--leaf-a)" d="M0,-14 Q10,-3 0,14 Q-10,-3 0,-14 Z"/></g>
                    <g transform="translate(126,120) rotate(-35)"><path class="leaf" style="animation-delay:1.58s" fill="var(--leaf-b)" d="M0,-13 Q9,-2 0,13 Q-9,-2 0,-13 Z"/></g>
                    <g transform="translate(174,118) rotate(30)"><path class="leaf" style="animation-delay:1.66s" fill="var(--leaf-a)" d="M0,-13 Q9,-2 0,13 Q-9,-2 0,-13 Z"/></g>
                    <g transform="translate(150,104) rotate(0)"><path class="leaf" style="animation-delay:1.74s" fill="var(--leaf-b)" d="M0,-14 Q10,-3 0,14 Q-10,-3 0,-14 Z"/></g>
                    <g transform="translate(108,124) rotate(-48)"><path class="leaf" style="animation-delay:1.50s" fill="var(--leaf-a)" d="M0,-13 Q9,-2 0,13 Q-9,-2 0,-13 Z"/></g>
                    <g transform="translate(192,120) rotate(45)"><path class="leaf" style="animation-delay:1.82s" fill="var(--leaf-b)" d="M0,-13 Q9,-2 0,13 Q-9,-2 0,-13 Z"/></g>
                    <g transform="translate(140,130) rotate(-8)"><path class="leaf" style="animation-delay:1.42s" fill="var(--leaf-a)" d="M0,-15 Q11,-3 0,15 Q-11,-3 0,-15 Z"/></g>
                    <g transform="translate(160,128) rotate(15)"><path class="leaf" style="animation-delay:1.90s" fill="var(--leaf-b)" d="M0,-14 Q10,-3 0,14 Q-10,-3 0,-14 Z"/></g>
                </g>
            </g>

            <!-- Крапки-плоди/бруньки (легкий акцент) -->
        </svg>

        <img class="logo" src="logo.png" alt="Логотип Надія">
    </div>

    <div class="wordmark">Наді<span>я</span></div>
    <div class="tagline">Реабілітаційний центр</div>
    <button class="replay" onclick="restart()">↻ Відтворити знову</button>

<script>
    // Листкам вмикаємо клас з pop-анімацією (щоб керувати повтором)
    function armLeaves() { document.querySelectorAll('.leaf').forEach(l => l.classList.add('run-pop')); }
    armLeaves();

    function restart() {
        const b = document.body;
        document.querySelectorAll('.leaf').forEach(l => l.classList.remove('run-pop'));
        b.classList.remove('run');
        void b.offsetWidth;               // форсуємо reflow
        b.classList.add('run');
        armLeaves();
    }
</script>
</body>
</html>
