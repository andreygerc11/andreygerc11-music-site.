<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий Кабінет | Надія</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-base: #09090b;
            --bg-panel: #141417;
            --bg-card: #1c1c21;
            --bg-input: #000000;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #20c997;
            --text-main: #f0f0f0;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column;
            background: radial-gradient(circle at center top, #18181b 0%, #09090b 100%);
        }

        .top-bar {
            min-height: 65px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 15px 30px;
            position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 15px;
        }
        .logo { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; color: #fff; text-decoration: none; letter-spacing: 1px; }
        .logo span { color: var(--accent); }

        .btn-back { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px;}
        .btn-back:hover { color: #fff; }

        .container {
            max-width: 1000px; margin: 40px auto; padding: 0 20px; width: 100%;
            display: grid; grid-template-columns: 1fr 2fr; gap: 30px;
            flex: 1;
        }

        /* ЛІВА ПАНЕЛЬ ПРОФІЛЮ */
        .profile-sidebar {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 40px 20px; text-align: center; height: fit-content;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .avatar-circle {
            width: 110px; height: 110px; background: linear-gradient(135deg, #1c1d1f, var(--accent));
            border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center;
            justify-content: center; font-size: 3rem; color: #fff; font-weight: 900;
            box-shadow: 0 10px 25px rgba(32, 201, 151, 0.3); border: 3px solid var(--bg-card);
        }
        .profile-email { font-size: 1.1rem; font-weight: 700; margin-bottom: 5px; word-break: break-all; color: #fff;}
        .profile-role { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; font-weight: 900; margin-bottom: 30px; letter-spacing: 1px;}

        .btn-logout {
            width: 100%; padding: 14px; background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); color: #ff4d4d;
            border-radius: 12px; cursor: pointer; font-weight: 800; text-transform: uppercase; transition: 0.3s;
            font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-logout:hover { background: #ff4d4d; color: #fff; border-color: #ff4d4d; box-shadow: 0 5px 15px rgba(255, 77, 77, 0.3);}

        /* ПРАВА ПАНЕЛЬ */
        .settings-content { display: flex; flex-direction: column; gap: 25px; }

        .settings-card {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .settings-card h2 {
            font-size: 1.2rem; margin-bottom: 25px; border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px; display: flex; align-items: center; gap: 12px; color: #fff;
        }
        .settings-card h2 i { color: var(--accent); font-size: 1.4rem;}

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 700; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 14px; background: var(--bg-input); border: 1px solid var(--border-color);
            color: #fff; border-radius: 10px; font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-action {
            background: linear-gradient(45deg, var(--accent), #17a67f); color: #04140f; border: none; padding: 16px 32px;
            border-radius: 50px; font-weight: 900; font-size: 0.9rem; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(32, 201, 151, 0.3);
        }
        .btn-action:hover { box-shadow: 0 8px 25px rgba(32, 201, 151, 0.5); transform: translateY(-2px); }
        .btn-action:disabled { background: #333; color: #777; cursor: not-allowed; box-shadow: none; transform: none;}

        .consult-price-box {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(145deg, var(--bg-card), #111);
            padding: 25px; border-radius: 15px; border: 1px solid var(--border-color);
            flex-wrap: wrap; gap: 15px; margin-bottom: 25px;
        }
        .consult-price-box .price { font-weight: 900; font-size: 2rem; color: var(--accent); }
        .consult-price-box .price-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }

        .consult-list { display: flex; flex-direction: column; gap: 15px; }
        .consult-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; }
        .consult-item-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .consult-date { font-weight: 700; color: #fff; }
        .consult-status { font-size: 0.72rem; font-weight: 900; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px; }
        .status-pending_payment { background: rgba(255,193,7,0.15); color: #ffc107; }
        .status-paid { background: rgba(32,201,151,0.15); color: var(--accent); }
        .status-completed { background: rgba(76,175,80,0.15); color: #4CAF50; }
        .consult-body p { font-size: 0.9rem; color: #ccc; margin-bottom: 6px; }
        .consult-body .field-label { color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.5px; }
        .empty-state { color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 20px 0; }

        .btn-outline {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 25px; background: transparent;
            border: 1px solid var(--border-color); color: #fff; border-radius: 50px;
            text-decoration: none; font-weight: 800; font-size: 0.85rem; transition: 0.3s; text-transform: uppercase;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); border-color: #fff; }

        #saveStatus { margin-top: 12px; font-size: 0.85rem; font-weight: 700; min-height: 20px; }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; margin: 20px auto;}
            .top-bar { padding: 15px; }
            .form-row { grid-template-columns: 1fr; }
            .consult-price-box { flex-direction: column; align-items: flex-start; }
            .btn-action { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="logo">НАДІ<span>Я</span></a>
        <div style="display: flex; gap: 20px;">
            <a href="index.html" class="btn-back"><i class="fas fa-home"></i> На головну</a>
            <a href="music.html" class="btn-back"><i class="fas fa-music"></i> Музика</a>
        </div>
    </header>

    <div class="container">

        <aside class="profile-sidebar">
            <div class="avatar-circle" id="userInitial">?</div>
            <div class="profile-email" id="userEmail">Завантаження...</div>
            <div class="profile-role">Особистий кабінет пацієнта</div>
            <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Вийти з акаунта</button>
        </aside>

        <main class="settings-content">

            <div class="settings-card">
                <h2><i class="fas fa-id-card"></i> Мої дані</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Повне ім'я</label>
                        <input type="text" id="fldFullName" placeholder="Прізвище Ім'я Побатькові">
                    </div>
                    <div class="form-group">
                        <label>Телефон</label>
                        <input type="text" id="fldPhone" placeholder="+380...">
                    </div>
                </div>
                <div class="form-group">
                    <label>Дата народження</label>
                    <input type="date" id="fldBirthDate">
                </div>
                <div class="form-group">
                    <label>Історія хвороби / скарги</label>
                    <textarea id="fldMedicalHistory" placeholder="Опишіть, будь ласка, суть проблеми, перенесені травми чи операції, наявні діагнози — це допоможе лікарю підготуватися до консультації."></textarea>
                </div>
                <button class="btn-action" id="saveProfileBtn"><i class="fas fa-save"></i> Зберегти дані</button>
                <div id="saveStatus"></div>
            </div>

            <div class="settings-card">
                <h2><i class="fas fa-calendar-check"></i> Консультації</h2>
                <div class="consult-price-box">
                    <div>
                        <div class="price-label">Онлайн-консультація</div>
                        <div class="price">400 ₴</div>
                    </div>
                    <button id="bookConsultBtn" class="btn-action"><i class="fas fa-calendar-plus"></i> Записатися й оплатити</button>
                </div>
                <div class="consult-list" id="consultList">
                    <div class="empty-state">Завантаження...</div>
                </div>
            </div>

            <div class="settings-card">
                <h2><i class="fas fa-headset"></i> Підтримка</h2>
                <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Виникли питання щодо запису, оплати чи консультації? Напишіть нам.</p>
                <a href="https://t.me/golosprotyraku_bot" target="_blank" class="btn-outline">
                    <i class="fab fa-telegram" style="color: #2AABEE; font-size: 1.2rem;"></i> Написати в Telegram
                </a>
            </div>

        </main>
    </div>

    <script>
        const API = 'https://andreygerc11-music-site.onrender.com';

        function safeRedirect(url) {
            try {
                window.location.href = url;
            } catch (e) {
                console.warn("Редирект заблоковано в середовищі попереднього перегляду:", e.message);
                if (url.startsWith('http')) window.open(url, '_blank');
            }
        }

        let currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('hz_user')); } catch(e) {}

        if (!currentUser) {
            safeRedirect("login.html");
        } else {
            document.getElementById('userEmail').innerText = currentUser.email;
            document.getElementById('userInitial').innerText = currentUser.email.charAt(0).toUpperCase();
            fetchPatientProfile();
        }

        const STATUS_LABELS = {
            pending_payment: 'Очікує оплати',
            paid: 'Оплачено, очікує лікаря',
            completed: 'Завершено'
        };

        function formatDate(iso) {
            if (!iso) return '';
            try { return new Date(iso).toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
            catch (e) { return iso; }
        }

        function renderConsultations(consultations) {
            const list = document.getElementById('consultList');
            if (!consultations || consultations.length === 0) {
                list.innerHTML = '<div class="empty-state">Записів на консультації ще немає.</div>';
                return;
            }
            list.innerHTML = consultations.slice().reverse().map(c => `
                <div class="consult-item">
                    <div class="consult-item-head">
                        <span class="consult-date">${formatDate(c.createdAt)}</span>
                        <span class="consult-status status-${c.status}">${STATUS_LABELS[c.status] || c.status}</span>
                    </div>
                    <div class="consult-body">
                        ${c.doctorName ? `<p><span class="field-label">Лікар:</span> ${c.doctorName}</p>` : ''}
                        ${c.notes ? `<p><span class="field-label">Нотатки лікаря:</span> ${c.notes}</p>` : ''}
                        ${c.prescription ? `<p><span class="field-label">Призначення:</span> ${c.prescription}</p>` : ''}
                        ${!c.doctorName && !c.notes ? '<p style="color: var(--text-muted);">Очікує на розгляд лікарем.</p>' : ''}
                    </div>
                </div>
            `).join('');
        }

        async function fetchPatientProfile() {
            try {
                const res = await fetch(`${API}/api/patient/profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentUser.email })
                });
                if (!res.ok) throw new Error();
                const data = await res.json();

                document.getElementById('fldFullName').value = data.fullName || '';
                document.getElementById('fldPhone').value = data.phone || '';
                document.getElementById('fldBirthDate').value = data.birthDate || '';
                document.getElementById('fldMedicalHistory').value = data.medicalHistory || '';

                renderConsultations(data.consultations || []);
            } catch (e) {
                document.getElementById('consultList').innerHTML = '<div class="empty-state">Помилка завантаження даних.</div>';
            }
        }

        document.getElementById('saveProfileBtn').addEventListener('click', async function() {
            const statusEl = document.getElementById('saveStatus');
            const originalText = this.innerHTML;
            this.innerHTML = 'Збереження...';
            this.disabled = true;
            statusEl.innerText = '';

            try {
                const res = await fetch(`${API}/api/patient/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentUser.email,
                        fullName: document.getElementById('fldFullName').value,
                        phone: document.getElementById('fldPhone').value,
                        birthDate: document.getElementById('fldBirthDate').value,
                        medicalHistory: document.getElementById('fldMedicalHistory').value
                    })
                });
                if (!res.ok) throw new Error();
                statusEl.style.color = '#4CAF50';
                statusEl.innerText = '✅ Дані збережено';
                setTimeout(() => { statusEl.innerText = ''; }, 3000);
            } catch (e) {
                statusEl.style.color = '#ff4d4d';
                statusEl.innerText = '❌ Не вдалося зберегти. Спробуйте пізніше.';
            } finally {
                this.innerHTML = originalText;
                this.disabled = false;
            }
        });

        document.getElementById('bookConsultBtn').addEventListener('click', async function() {
            const originalText = this.innerHTML;
            this.innerHTML = 'Обробка...';
            this.disabled = true;
            try {
                const res = await fetch(`${API}/api/patient/book-consultation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentUser.email })
                });
                const data = await res.json();
                if (data && data.url && data.url.trim() !== '') {
                    safeRedirect(data.url);
                } else {
                    alert('Помилка платежу. Сервер не надав правильне посилання.');
                    this.innerHTML = originalText;
                    this.disabled = false;
                }
            } catch (err) {
                alert('Помилка сервера. Перевірте з\'єднання.');
                this.innerHTML = originalText;
                this.disabled = false;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm("Ви дійсно хочете вийти з акаунта?")) {
                localStorage.removeItem('hz_user');
                try { google.accounts.id.disableAutoSelect(); } catch(e) {}
                safeRedirect("login.html");
            }
        });
    </script>
</body>
</html>
