<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Завантаження…</title>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#06080d;color:#cfd8e6;font-family:system-ui,'Segoe UI',sans-serif;text-align:center;padding:16px">
<p id="m">Готуємо завантаження…</p>
<script>
  // Постійне посилання на найновішу версію (для бота й листів): dl?a=antijam → файл з updates.json
  const key = new URLSearchParams(location.search).get('a');
  fetch('updates.json', { cache: 'no-store' }).then(r => r.json()).then(u => {
    const x = u[key];
    if (!x || !x.url) throw 0;
    location.replace(x.url);
  }).catch(() => {
    document.getElementById('m').innerHTML = 'Файл не знайдено. <a href="apps" style="color:#20c997">Усі застосунки</a>';
  });
</script>
</body>
</html>
