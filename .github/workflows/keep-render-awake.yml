name: Keep Render service awake

# Тільки навколо 8:00 і 20:00 за Києвом (UTC+2 взимку / UTC+3 влітку),
# а не цілодобово — щоб не витрачати місячний ліміт годин безкоштовного
# тарифу Render на постійну роботу сервісу, коли це не потрібно.
on:
  schedule:
    - cron: "*/10 4-6 * * *"
    - cron: "*/10 16-18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend to prevent it from spinning down
        run: curl -sS --max-time 60 --retry 2 https://andreygerc11-music-site.onrender.com/api/music -o /dev/null || true
